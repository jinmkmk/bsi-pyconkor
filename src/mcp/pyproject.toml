[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "school-lunch-mcp"
version = "0.1.0"
description = "MCP server for NEIS school lunch data"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "mcp==1.29.0",
  "pydantic==2.11.7",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[project.scripts]
school-lunch-mcp = "lunch_mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["lunch_mcp*"]
